<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · Troc Local</title>
  <meta name="description" content="Vos conversations avec les autres membres de Troc Local.">
  <meta name="theme-color" content="#1f4d3a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/pages/messages.js" defer></script>
</head>
<body class="messages-page" data-page="messages">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 10.5 5.5H29v21H10.5z" fill="#ffd23f" stroke="#14261f" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="16" r="2.4" fill="#fff" stroke="#14261f" stroke-width="2"/></svg>troc local</a>
      <nav id="nav" aria-label="Menu principal"></nav>
    </div>
  </header>

  <main id="main" class="container messenger">
    <h1 class="visually-hidden">Messages</h1>
    <nav id="list" class="conv-list" aria-label="Conversations"></nav>
    <section class="thread" aria-label="Conversation">
      <div id="thread-header" class="thread-header" hidden></div>
      <div id="messages" class="messages" aria-live="polite">
        <div class="thread-empty muted">Choisissez une conversation pour lire les messages.</div>
      </div>
      <p id="typing" class="typing" aria-live="polite" hidden></p>
      <div id="suggest" class="suggest" hidden>
        <button type="button" class="btn btn-small suggest-btn" id="suggest-btn">Suggérer des réponses</button>
        <div id="suggest-list" class="suggest-list" role="group" aria-label="Réponses suggérées"></div>
      </div>
      <form id="reply" class="reply" hidden>
        <label class="visually-hidden" for="content">Votre message</label>
        <input id="content" name="content" placeholder="Votre message…" required autocomplete="off">
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </form>
    </section>
  </main>
</body>
</html>
