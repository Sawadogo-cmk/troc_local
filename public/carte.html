<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte des annonces · Troc Local</title>
  <meta name="description" content="Tous les objets à donner autour de vous, sur une carte, avec un filtre de distance.">
  <meta name="theme-color" content="#1f4d3a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <script src="/js/common.js" defer></script>
  <script src="/js/pages/carte.js" defer></script>
</head>
<body class="map-page">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16 10.5 5.5H29v21H10.5z" fill="#ffd23f" stroke="#14261f" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="16" r="2.4" fill="#fff" stroke="#14261f" stroke-width="2"/></svg>troc local</a>
      <nav id="nav" aria-label="Menu principal"></nav>
    </div>
  </header>

  <main id="main" class="map-layout">
    <aside class="map-side">
      <h1>Autour de vous</h1>
      <form id="map-form" class="map-form">
        <label class="visually-hidden" for="map-city">Ville</label>
        <div class="map-search">
          <input id="map-city" name="city" placeholder="Une ville" autocomplete="address-level2">
          <button type="submit" class="btn btn-primary btn-small">Centrer</button>
        </div>
        <button type="button" class="btn btn-small" id="locate">Utiliser ma position</button>
        <div class="row">
          <label>Rayon
            <select name="radius">
              <option value="2">2 km</option>
              <option value="5">5 km</option>
              <option value="10" selected>10 km</option>
              <option value="25">25 km</option>
              <option value="50">50 km</option>
              <option value="100">100 km</option>
              <option value="1000">Tout le pays</option>
            </select>
          </label>
          <label>Catégorie
            <select name="category"><option value="">Toutes</option></select>
          </label>
        </div>
        <p id="map-status" class="muted status-note" role="status"></p>
      </form>
      <p id="map-count" class="map-count" aria-live="polite"></p>
      <ul id="map-list" class="map-list"></ul>
    </aside>
    <div id="map" class="map" role="region" aria-label="Carte des annonces"></div>
  </main>
</body>
</html>
